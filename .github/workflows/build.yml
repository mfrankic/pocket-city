name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: dev-2026-08
      - run: odin test city

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-amd64
            bin: pocket-city
          - os: windows-latest
            artifact: windows-amd64
            bin: pocket-city.exe
          - os: macos-latest
            artifact: macos-arm64
            bin: pocket-city
          - os: macos-26-intel
            artifact: macos-amd64
            bin: pocket-city
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: dev-2026-08
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Linux link libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev
      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        run: odin build . -o:speed -out:${{ matrix.bin }}
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf "dist/pocket-city-${{ steps.ver.outputs.name }}-${{ matrix.artifact }}.tar.gz" "${{ matrix.bin }}"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          zip "dist/pocket-city-${{ steps.ver.outputs.name }}-${{ matrix.artifact }}.zip" "${{ matrix.bin }}"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "${{ matrix.bin }}" -DestinationPath "dist/pocket-city-${{ steps.ver.outputs.name }}-${{ matrix.artifact }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-city-${{ matrix.artifact }}
          path: dist/pocket-city-*
          if-no-files-found: error

  release:
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
